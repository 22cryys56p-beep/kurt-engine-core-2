<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Kurt's English</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="site-wrapper">
    <div class="page-container">

        <!-- Top Section: Handcrafted Wooden Picture Frame containing Claymation Diorama -->
        <header class="header-section">
            <div class="wooden-picture-frame">
                <div class="frame-molding">
                    <div class="frame-inner-recess">
                        <!-- 3D Claymation Scene Artwork (V2: Level water, true logo, single-line banner) -->
                        <img src="assets/images/claymation_v2.jpg" alt="Kurt's English 3D Diorama" class="claymation-scene-img" />

                        <!-- Live 7-Link 3D Navigation Bar -->
                        <nav class="clay-nav-bar" aria-label="Main Navigation">
                            <ul>
                                <li><a href="index.html">ALOHA</a></li>
                                <li><a href="video.html">VIDEO</a></li>
                                <li><a href="prices.html">PRICES</a></li>
                                <li><a href="classes-.html">CLASSES/お知らせ</a></li>
                                <li><a href="students.html">STUDENTS</a></li>
                                <li><a href="who.html">WHO</a></li>
                                <li class="last"><a href="where.html">WHERE</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </header>

        <!-- Light Blue Background Area: 820px wide matching the frame edges,
             all the way up to the bottom of the frame, and all the way down to the bottom of the screen behind the grass -->
        <main class="light-blue-content-area">
            <div class="content-container">
                <div class="page-content">
                    {{ content }}
                </div>
            </div>

            <!-- Grass Ground Footer: 820px wide sitting at the bottom with light blue behind it -->
            <footer class="site-footer">
                <img src="assets/images/grass.png" alt="" class="grass-img" />
            </footer>
        </main>

    </div>
</div>

</body>
</html>
